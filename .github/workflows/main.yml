name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 99999

    steps:
      # ─────────────────────────────────────────────
      # 1. LIBERAR ESPAÇO E MONTAR DISCO EXTRA
      # ─────────────────────────────────────────────
      - name: Free Up Space & Mount Extra Disk
        run: |
          Write-Host "=== Disk before cleanup ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

          $toRemove = @(
            "$env:SystemDrive\hostedtoolcache\windows\Ruby",
            "$env:SystemDrive\hostedtoolcache\windows\go",
            "$env:SystemDrive\hostedtoolcache\windows\Python",
            "$env:ProgramFiles\dotnet",
            "$env:ProgramFiles\MongoDB",
            "$env:ProgramFiles\PostgreSQL",
            "$env:ProgramFiles (x86)\Google\Chrome",
            "$env:ProgramFiles\Mozilla Firefox"
          )
          foreach ($path in $toRemove) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed: $path" -ForegroundColor Green
            }
          }

          Write-Host "=== Disk D: info ===" -ForegroundColor Cyan
          Get-PSDrive D -ErrorAction SilentlyContinue

          $vhdPath = "D:\extra_disk.vhdx"
          New-VHD -Path $vhdPath -SizeBytes 100GB -Dynamic -ErrorAction SilentlyContinue
          Mount-VHD -Path $vhdPath
          $disk = Get-Disk | Where-Object { $_.OperationalStatus -eq 'Online' -and $_.PartitionStyle -eq 'RAW' } | Select-Object -Last 1
          if ($disk) {
            Initialize-Disk -Number $disk.Number -PartitionStyle MBR -PassThru |
              New-Partition -AssignDriveLetter -UseMaximumSize |
              Format-Volume -FileSystem NTFS -NewFileSystemLabel "ExtraDisk" -Confirm:$false
          }

          Write-Host "=== Disk after setup ===" -ForegroundColor Cyan
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

          "EXTRA_DISK=E:" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STORAGE_ROOT=D:\storage" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force -Path "D:\storage" | Out-Null

      # ─────────────────────────────────────────────
      # 2. OTIMIZAR DESEMPENHO DA CPU E SISTEMA
      # ─────────────────────────────────────────────
      - name: System & CPU Performance Optimization
        run: |
          Write-Host "=== Applying CPU & Gaming Optimizations ===" -ForegroundColor Cyan
          
          # Set High Performance Power Plan
          powercfg /s 8c5e7cd5-e98b-431e-a701-d00194007347 2>$null

          # Disable Unnecessary Background Services to save CPU/RAM
          $servicesToStop = @("SysMain", "WSearch", "wuauserv")
          foreach ($service in $servicesToStop) {
            Stop-Service -Name $service -Force -ErrorAction SilentlyContinue
            Set-Service -Name $service -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Adjust Win32PrioritySeparation for maximum CPU priority on foreground applications
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' `
            -Name "Win32PrioritySeparation" -Value 38 -Force

          Write-Host "CPU and System optimizations applied successfully." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 3. CONFIGURAR RDP E AJUSTES DE CÂMERA/60FPS
      # ─────────────────────────────────────────────
      - name: Configure RDP Settings & Fix 3D Camera/FPS
        run: |
          # Basic RDP Settings
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # Enable RemoteFX / AVC444 for smoother rendering & 60 FPS
          $rdpGpoPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $rdpGpoPath)) { New-Item -Path $rdpGpoPath -Force | Out-Null }
          
          Set-ItemProperty -Path $rdpGpoPath -Name "SelectNetworkDetect" -Value 1 -Force
          Set-ItemProperty -Path $rdpGpoPath -Name "fEnableWinstationGFXRender" -Value 1 -Force
          
          # Force 60 FPS target for RDP stream
          $dwmPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'
          Set-ItemProperty -Path $dwmPath -Name "DWMFRAMEINTERVAL" -Value 15 -Force

          # Firewall Config
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP and RemoteFX Graphics configured." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 4. CREAR USUARIO RDP
      # ─────────────────────────────────────────────
      - name: Create RDP User
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]]@(33,35,36,37,38,42,43,45,61,64)
          }
          $rawPassword  = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators"        -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users"  -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "User creation failed"; exit 1
          }

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RDP user created." -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 5. INSTALAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installer -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$installer`"","/quiet","/norestart" -Wait
          Remove-Item $installer -Force

      # ─────────────────────────────────────────────
      # 6. CONECTAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Connect Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            Start-Sleep -Seconds 4
            $tsIP = & $ts ip -4 2>$null
            $retries++
          }

          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 7. VERIFICAR RDP
      # ─────────────────────────────────────────────
      - name: Verify RDP
        run: |
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port 3389 not reachable"; exit 1
          }
          Write-Host "RDP reachable on port 3389 ✓" -ForegroundColor Green

      # ─────────────────────────────────────────────
      # 8. VERIFICAR APLICACIONES INSTALADAS
      # ─────────────────────────────────────────────
      - name: Verify Installed Apps
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         VERIFICATION REPORT                      ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          
          Write-Host "║  NODE.JS:" -NoNewline
          try { node --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "║  NPM:    " -NoNewline
          try { npm --version 2>$null; Write-Host " ✓" -ForegroundColor Green } catch { Write-Host " ✗" -ForegroundColor Red }
          
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

      # ─────────────────────────────────────────────
      # 9. MANTENER SESIÓN ACTIVA
      # ─────────────────────────────────────────────
      - name: Keep Alive & Show Credentials
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║         RDP ACCESS INFO                          ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  IP:       $env:TAILSCALE_IP"
          Write-Host "║  User:     RDP"
          Write-Host "║  Password: $env:RDP_PASSWORD"
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  STORAGE                                         ║" -ForegroundColor Cyan
          Write-Host "║  C: ~14GB (sistema)                              ║"
          Write-Host "║  D: ~60GB (runner disk)                          ║"
          Write-Host "║  E: ~100GB (VHD extra)                           ║"
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          # Mantener a sessão ativa com baixo uso de processamento
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "Keep alive... ($i minutos)" -ForegroundColor DarkGray
          }
          
